apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"



def getPassword(String currentUser, String keyChain) {
    // The security CLI only exists on macOS; debug builds elsewhere
    // (Linux CI, containers) don't need the release keystore password
    if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        return ""
    }
    return providers.exec {
       commandLine 'security', '-q', 'find-generic-password', '-a', currentUser, '-s', keyChain, '-w'
       ignoreExitValue true
    }.standardOutput.asText.get().trim()
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")
    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]
    //   Pass -PseekBundleDebugJs=true to embed the JS bundle (and assets) in
    //   the debug APK, producing a standalone build that runs without a Metro
    //   dev server. Normal local debug builds leave this unset and use Metro.
    if (project.hasProperty("seekBundleDebugJs")) {
        debuggableVariants = []
    }
    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []
    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
         
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

// If global gradle.properties has SEEK_RELEASE_KEY_PASSWORD defined, use it, otherwise use the keychain
// Do not add the keychain password to android/app/gradle.properties to not add it to version control instead use global
def pass = project.hasProperty('SEEK_RELEASE_KEY_PASSWORD') ? project.property('SEEK_RELEASE_KEY_PASSWORD') : getPassword("iNaturalist.org","inaturalist-android");
def includeDebugCameraAssetsInRelease = project.hasProperty('SEEK_INCLUDE_DEBUG_CAMERA_ASSETS') && project.property('SEEK_INCLUDE_DEBUG_CAMERA_ASSETS').toString().toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
// def jscFlavor = 'org.webkit:android-jsc:+'
// adding international version for timezone support with date-fns-tz in posting to iNat
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * QNN libraries for the Snapdragon NPU, copied from a local QAIRT SDK at build time.
 * Qualcomm's license lets apps ship them inside the APK but not on their own, so they
 * are never committed. Point SEEK_QNN_SDK_DIR (gradle property or environment variable)
 * at an unpacked QAIRT SDK (its root, with lib/aarch64-android and lib/hexagon-v75) or at
 * a folder holding the five libraries. Without it the app builds and classifies on the CPU.
 */
def qnnSdkDir = project.findProperty('SEEK_QNN_SDK_DIR') ?: System.getenv('SEEK_QNN_SDK_DIR')
def qnnJniLibsDir = layout.buildDirectory.dir("generated/qnn-jniLibs").get().asFile
def qnnLibraries = [
    "lib/aarch64-android/libQnnHtp.so",
    "lib/aarch64-android/libQnnHtpV75Stub.so",
    "lib/aarch64-android/libQnnSystem.so",
    "lib/aarch64-android/libQnnHtpPrepare.so",
    "lib/hexagon-v75/unsigned/libQnnHtpV75Skel.so",
]
def copyQnnLibraries = tasks.register("copyQnnLibraries") {
    def outDir = new File(qnnJniLibsDir, "arm64-v8a")
    outputs.dir(outDir)
    doLast {
        project.delete(outDir)
        outDir.mkdirs()
        if (!qnnSdkDir) {
            logger.warn("SEEK_QNN_SDK_DIR not set: building without the NPU libraries (CPU only)")
            return
        }
        qnnLibraries.each { relative ->
            def name = new File(relative).name
            def source = [new File(qnnSdkDir, relative), new File(qnnSdkDir, name)].find { it.isFile() }
            if (source == null) {
                throw new GradleException("${name} not found in SEEK_QNN_SDK_DIR=${qnnSdkDir}")
            }
            project.copy { from source; into outDir }
        }
    }
}
preBuild.dependsOn(copyQnnLibraries)

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.inaturalist.seek"
    defaultConfig {
        applicationId "org.inaturalist.seek"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 415
        versionName "2.18.0"
        // for creating ic_seek_adaptiveappicon.xml
        vectorDrawables.useSupportLibrary = true
    }

    // Without the iNaturalist release keystore (e.g. open-source/CI builds), release
    // builds are signed with the debug key and get their own package id, so they
    // install next to the Play Store app instead of conflicting with it.
    def hasReleaseKeystore = file(SEEK_RELEASE_STORE_FILE).exists()

    base.archivesName = defaultConfig.applicationId + "-v" + defaultConfig.versionName + "+" + defaultConfig.versionCode
    
    signingConfigs {
        release {
            storeFile file(SEEK_RELEASE_STORE_FILE)
            storePassword pass
            keyAlias SEEK_RELEASE_KEY_ALIAS
            keyPassword pass
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                applicationIdSuffix ".preview"
                versionNameSuffix "-preview"
            }
            ndk {
                // attempt to get rid of warning in Play Console
                debugSymbolLevel "FULL"
            }
        }
    }

    // Model packs are copied out of the APK on first launch; storing them
    // uncompressed makes that a straight copy.
    androidResources {
        noCompress += ["tflite"]
    }

    // The NPU path (Qualcomm Hexagon) loads native libraries LiteRT finds by path in the
    // app's native library dir, so they must be extracted on install. The QNN
    // libraries are added from a local Qualcomm AI Runtime (QAIRT) SDK, see SEEK_QNN_SDK_DIR above;
    // they are prebuilt and stripped, and the DSP skeleton isn't an ARM binary.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ["**/libQnn*.so"]
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += [qnnJniLibsDir]
        }
    }

    if (includeDebugCameraAssetsInRelease) {
        sourceSets {
            release {
                assets.srcDirs += ["src/debug/assets"]
            }
        }
    }
    
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    // on-device subject detection for the camera and the reframe screen
    implementation("com.google.mlkit:object-detection:17.0.2")

}
